<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Zoya AI Assistant 💅</title>
    
    <!-- PWA Manifest & App configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e111a" />
    
    <!-- Apple Mobile Web App support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zoya AI" />
    <link rel="apple-touch-icon" href="/icon-192.jpg" />    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/icon-192.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for Mobile PWA Installation -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => console.log("Service Worker registered successfully!", reg.scope))
            .catch((err) => console.error("Service Worker registration failed:", err));
        });
      }
    </script>
  </body>
</html>
